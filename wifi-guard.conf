# ============================================================
# WiFi Guard 配置文件（wifi-guard.conf）
# ============================================================
# 格式：KEY=VALUE（每行一个，# 开头为注释）
# 本文件会被 wifi-guard.sh 直接 source，所以必须是合法的 shell 赋值语句。
# 修改后无需重启手机，杀掉守护进程后会自动重新加载：
#   adb shell pkill -f wifi-guard.sh
# ============================================================

# ------------------------- 扫描参数 -------------------------

# 主循环检查间隔（秒）
# 守护进程每隔多久检查一次 WiFi 状态和周围环境。
# 值越小响应越快，但 CPU 唤醒越频繁、越耗电。
# 推荐范围：15~60
CHECK_INTERVAL=30

# WiFi 关闭/断开状态下的主动扫描间隔（秒）
# WiFi 处于关闭状态时，每隔多久触发一次后台扫描来检测已保存网络。
# 值越小进入 WiFi 范围后开启越快，但耗电明显增加。
# 推荐范围：60~180（家用 120，频繁移动 60）
SCAN_INTERVAL=120

# 单次扫描最长等待时间（秒）
# 触发扫描后最多等多久，超时就认为本次扫描失败，下一轮重试。
# 一般不需要改，除非你的设备扫描特别慢。
# 推荐范围：15~30
SCAN_TIMEOUT=24

# ------------------------- 开关策略 -------------------------

# 刚开启 WiFi 后的连接宽限期（秒）
# WiFi 刚打开后给系统多少时间去连接，期间不会因为"没连上"就关闭 WiFi。
# 如果你的路由器连接较慢（如 WPA3/802.1X），可以适当调大。
# 推荐范围：30~120
GRACE_AFTER_ENABLE=60

# 连续确认轮数：连续 N 轮扫描都"不在范围"才关闭 WiFi
# 防止因单次扫描失败或信号波动导致误关。
# 设为 1 则最灵敏但可能误关；设为 3 则更保守但关闭延迟更长。
# 推荐范围：1~3
OFF_CONFIRM_ROUNDS=2

# 是否尊重用户手动关闭 WiFi
# 1 = 用户手动关闭 WiFi 后，脚本不会自动再开启（需先离开范围再回来）
# 0 = 只要在已保存网络范围内，脚本就会强制开启 WiFi（忽略用户手动关闭）
# 推荐：1（尊重用户意图）
RESPECT_MANUAL_OFF=1

# 手动关闭 WiFi 后的最长保持时间（秒）
# 仅在 RESPECT_MANUAL_OFF=1 时生效。
# 用户手动关闭 WiFi 后，脚本会保持关闭状态最多多久，
# 超时后即使仍在范围内也会重新自动开启 WiFi。
# 默认 900 秒 = 15 分钟
MANUAL_OFF_HOLD=900

# ------------------------- 移动数据 -------------------------

# 是否在 WiFi 开关时同步切换移动数据
# 1 = 开启 WiFi 时自动关闭移动数据，关闭 WiFi 时自动开启移动数据
# 0 = 不管理移动数据，保持用户原有设置
# 注意：部分定制 ROM 可能不支持通过命令行控制移动数据
MANAGE_MOBILE_DATA=1

# ------------------------- 日志参数 -------------------------

# "未检测到已保存网络"等重复日志的最小间隔（秒）
# 避免在未处于 WiFi 范围时每秒都写一条相同日志，浪费空间和 IO。
# 推荐范围：300~1200
QUIET_LOG_INTERVAL=600

# 日志文件最大字节数
# 超过此大小后自动截断，仅保留最近 400 行。
# 默认 131072 = 128KB
LOG_MAX_BYTES=131072

# ------------------------- 硬件参数 -------------------------

# 无线网卡接口名
# 绝大多数 Android 设备都是 wlan0，极少数设备可能不同。
# 如果不确定，运行：adb shell ip link show | grep wlan
WLAN_IFACE=wlan0
